name: CI

on:
  push:
  pull_request:

env:
  WGPU_BACKEND: vulkan
  LF_ALLOW_FALLBACK_ADAPTER: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache RAW sample corpus
        uses: actions/cache@v4
        with:
          path: tests/raw-samples/files
          key: raw-samples-${{ hashFiles('tests/raw-samples/manifest.json') }}
      # A raw.pixls.us outage must not fail the build: the sample tests skip absent files.
      - name: Fetch RAW sample corpus
        continue-on-error: true
        run: bash scripts/fetch-raw-samples.sh
      - name: Report RAW sample corpus
        id: samples
        run: |
          n=$(find tests/raw-samples/files -type f 2>/dev/null | wc -l)
          total=$(grep -c '"sha256"' tests/raw-samples/manifest.json)
          echo "RAW samples present: $n of $total" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt "$total" ]; then echo "::warning::RAW samples present: $n of $total (the sample tests will skip the rest)"; fi
          if [ "$n" -eq "$total" ]; then echo "require=1" >> "$GITHUB_OUTPUT"; else echo "require=0" >> "$GITHUB_OUTPUT"; fi
      # --nocapture so the parity tests print their worst figures on success (nothing else prints).
      - name: Test
        env:
          LF_REQUIRE_SAMPLES: ${{ steps.samples.outputs.require }}
        run: cargo test --workspace -- --nocapture
