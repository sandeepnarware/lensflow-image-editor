name: CI

on:
  push:
  pull_request:

env:
  LF_ALLOW_FALLBACK_ADAPTER: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 gdb
      - run: cargo fmt --all --check
      # The installers' inputs in packaging/ (WiX source, plists, desktop entry, icons).
      - name: Check packaging inputs
        run: |
          sudo apt-get install -y libxml2-utils desktop-file-utils
          bash scripts/release/check-packaging.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache RAW sample corpus
        uses: actions/cache@v4
        with:
          path: tests/raw-samples/files
          key: raw-samples-${{ hashFiles('tests/raw-samples/manifest.json') }}
      # A raw.pixls.us outage must not fail the build: the sample tests skip absent files.
      - name: Fetch RAW sample corpus
        continue-on-error: true
        run: bash scripts/fetch-raw-samples.sh
      - name: Report RAW sample corpus
        id: samples
        run: |
          n=$(find tests/raw-samples/files -type f 2>/dev/null | wc -l)
          total=$(grep -c '"sha256"' tests/raw-samples/manifest.json)
          echo "RAW samples present: $n of $total" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt "$total" ]; then echo "::warning::RAW samples present: $n of $total (the sample tests will skip the rest)"; fi
          if [ "$n" -eq "$total" ]; then echo "require=1" >> "$GITHUB_OUTPUT"; else echo "require=0" >> "$GITHUB_OUTPUT"; fi
      # --nocapture so the parity tests print their worst figures on success (nothing else prints).
      # A software-Vulkan hang once burned the whole job limit (28 min) with no clue where.
      # scripts/ci-test-watchdog.sh runs the tests and, if the output stalls for 4 minutes, dumps
      # every thread's stack (gdb) of each running test binary and fails; the step limit is a
      # backstop for anything else.
      - name: Test
        timeout-minutes: 20
        env:
          LF_REQUIRE_SAMPLES: ${{ steps.samples.outputs.require }}
        run: bash scripts/ci-test-watchdog.sh cargo test --workspace -- --nocapture

  # The desktop app on each platform: a release build uploaded as an artifact, and lf-app's
  # tests. GPU tests skip without an adapter (the Linux runner has none here; the workspace
  # job above runs them on lavapipe); Windows has WARP and macOS has Metal.
  app:
    name: app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            binary: lensflow-image-editor.exe
          - os: macos-latest
            name: macos
            binary: lensflow-image-editor
          - os: ubuntu-24.04
            name: linux
            binary: lensflow-image-editor
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      # Vulkan only, and no driver installed: wgpu must not pick up a GL software adapter.
      - name: Linux backend
        if: runner.os == 'Linux'
        run: echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build -p lf-app --release
      - name: Test
        timeout-minutes: 25
        run: cargo test -p lf-app
      - uses: actions/upload-artifact@v4
        with:
          name: lensflow-image-editor-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
