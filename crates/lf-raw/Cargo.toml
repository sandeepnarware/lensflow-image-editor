[package]
name = "lf-raw"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rawler = "0.8"
rayon.workspace = true
thiserror.workspace = true
half.workspace = true
image = { workspace = true, features = ["jpeg", "tiff", "webp"] }
kamadak-exif.workspace = true
log.workspace = true
lf-pipeline = { path = "../lf-pipeline" }
lf-settings = { path = "../lf-settings" }
sha2.workspace = true
hex.workspace = true
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crc32fast = "1"

[dev-dependencies]
lf-pipeline = { path = "../lf-pipeline", features = ["test-support"] }
serde_json.workspace = true
tempfile = "3"
filetime = "0.2"
