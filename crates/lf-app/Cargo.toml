[package]
name = "lf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lensflow-image-editor"
path = "src/main.rs"

[dependencies]
lf-pipeline = { path = "../lf-pipeline" }
lf-account = { path = "../lf-account" }
lf-catalog = { path = "../lf-catalog" }
lf-raw = { path = "../lf-raw" }
lf-settings = { path = "../lf-settings" }
lf-grade = { path = "../lf-grade" }
# File dialogs (MIT). Default features: the XDG desktop portal on Linux, so no GTK.
rfd = "0.17"
# Downloads the installer from its signed link (not through the account client, so the
# bearer token never goes to the storage host). Same version and features as lf-account.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2.workspace = true
hex.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence", "x11", "wayland", "links"] }
directories = "6"
semver = "1"
env_logger = "0.11"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# `grade --out` writes JPEG copies (the `jpeg` feature; the workspace's has png only).
image = { workspace = true, features = ["jpeg"] }
# Sidecar timestamps (`updated_at`), so a grade written beside a photo wins over an older one.
chrono.workspace = true

[dev-dependencies]
egui_kittest = "0.37"
lf-pipeline = { path = "../lf-pipeline", features = ["test-support"] }
tempfile = "3"
# A second connection holding the catalogue's write lock (busy-retry tests).
rusqlite.workspace = true
# MsgDiscriminants (tests only): every Msg variant, to check each reaches its owner. MIT.
strum = "0.27"
strum_macros = "0.27"
httpmock = "0.8"

[target.'cfg(windows)'.dependencies]
# GetDriveTypeW: is the catalogue root on a network drive? AttachConsole/AllocConsole and
# CreateFileW: `--version`, `--help` and `grade` print to the terminal a release build was
# started from, and read from it.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds packaging/icons/app.ico and the version info into the .exe (build.rs). MIT.
winresource = "0.1.34"

# cargo-deb (lensflow-ImageEditor_<version>_amd64.deb). Asset sources are relative to this
# file; scripts/release/check-packaging.sh checks that each one exists.
[package.metadata.deb]
name = "lensflow-image-editor"
maintainer = "Sandeep Kumar Narware <sandeep.kumar.narware@gmail.com>"
copyright = "2026 LensFlow / Sandeep Kumar Narware"
license-file = ["../../LICENSE", "0"]
extended-description = """\
lensflow-ImageEditor edits and grades RAW photos for LensFlow studios: a GPU develop \
pipeline, a local catalogue and exports, matching the LensFlow web editor."""
section = "graphics"
priority = "optional"
depends = "$auto, libvulkan1"
assets = [
    ["target/release/lensflow-image-editor", "usr/bin/", "755"],
    ["../../packaging/linux/lensflow-image-editor.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/16.png", "usr/share/icons/hicolor/16x16/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/24.png", "usr/share/icons/hicolor/24x24/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/32.png", "usr/share/icons/hicolor/32x32/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/48.png", "usr/share/icons/hicolor/48x48/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/64.png", "usr/share/icons/hicolor/64x64/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/128.png", "usr/share/icons/hicolor/128x128/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/256.png", "usr/share/icons/hicolor/256x256/apps/lensflow-image-editor.png", "644"],
    ["../../packaging/icons/512.png", "usr/share/icons/hicolor/512x512/apps/lensflow-image-editor.png", "644"],
    ["../../NOTICE", "usr/share/doc/lensflow-image-editor/NOTICE", "644"],
]
