[package]
name = "lf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lensflow-image-editor"
path = "src/main.rs"

[dependencies]
lf-pipeline = { path = "../lf-pipeline" }
lf-account = { path = "../lf-account" }
lf-catalog = { path = "../lf-catalog" }
lf-raw = { path = "../lf-raw" }
lf-settings = { path = "../lf-settings" }
lf-grade = { path = "../lf-grade" }
# File dialogs (MIT). Default features: the XDG desktop portal on Linux, so no GTK.
rfd = "0.17"
# Downloads the installer from its signed link (not through the account client, so the
# bearer token never goes to the storage host). Same version and features as lf-account.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2.workspace = true
hex.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence", "x11", "wayland", "links"] }
directories = "6"
semver = "1"
env_logger = "0.11"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true

[dev-dependencies]
egui_kittest = "0.37"
lf-pipeline = { path = "../lf-pipeline", features = ["test-support"] }
tempfile = "3"
# A second connection holding the catalogue's write lock (busy-retry tests).
rusqlite.workspace = true
# MsgDiscriminants (tests only): every Msg variant, to check each reaches its owner. MIT.
strum = "0.27"
strum_macros = "0.27"
httpmock = "0.8"

[target.'cfg(windows)'.dependencies]
# GetDriveTypeW: is the catalogue root on a network drive? AttachConsole: `--version` and
# `--help` print to the terminal a release build was started from.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
