[package]
name = "lf-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lf-settings = { path = "../lf-settings" }
lf-raw = { path = "../lf-raw" }
lf-pipeline = { path = "../lf-pipeline" }
image = { workspace = true, features = ["jpeg", "png", "tiff", "webp", "avif"] }
# Lossy WebP (libwebp, BSD-3-Clause, built from source by libwebp-sys); TIFF tags and PNG chunks.
webp = { version = "0.3", default-features = false }
tiff = "0.11"
crc32fast = "1"
# ICC colour conversion and soft-proofing: Little CMS (MIT), built from source.
lcms2 = { version = "6", features = ["static"] }
# Text watermarks: glyph outlines rasterised from egui's bundled Ubuntu-Light (see NOTICE).
ab_glyph = "0.2"
epaint_default_fonts = "0.37"
half.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
chrono.workspace = true
uuid.workspace = true

[features]
# Test hooks (enabled for this crate's own tests): a file named `lf-test-panic.*` makes the
# decoder panic, `lf-test-gpu-fail.*` makes a thumbnail fail with a device error.
test-hooks = []

[dev-dependencies]
lf-catalog = { path = ".", features = ["test-hooks"] }
kamadak-exif.workspace = true
lf-pipeline = { path = "../lf-pipeline", features = ["test-support"] }
filetime = "0.2"
tempfile = "3"
# Destroying a device (the device-lost export test).
wgpu = "30.0.1"
chrono.workspace = true
