# Windows builds link the C runtime statically, so the installed app needs no Visual C++
# redistributable (spec Goal 8). A RUSTFLAGS environment variable would replace this.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
